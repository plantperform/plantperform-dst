services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dst2}
      POSTGRES_USER: ${POSTGRES_USER:-dst2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dst2}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dst2} -d ${POSTGRES_DB:-dst2}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
