[workspace]
name = "dst2-backend"
version = "0.1.0"
description = "FastAPI backend for crop rotation planning"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.13.*"
postgresql = "16.*"


[pypi-dependencies]
fastapi = ">=0.115.0"
boto3 = ">=1.35.0"
argon2-cffi = ">=23.1.0"
pyjwt = ">=2.10.0"
httpx = ">=0.28.0"
uvicorn = { version = ">=0.34.0", extras = ["standard"] }
ruff = ">=0.11.0"
psycopg = { version = ">=3.2.0", extras = ["binary"] }
sqlalchemy = ">=2.0.0"
geoalchemy2 = ">=0.17.0"
alembic = ">=1.14.0"
pyogrio = ">=0.10.0"
shapely = ">=2.0.0"
pyproj = ">=3.7.0"
pandas = ">=2.2.0"
python-dotenv = ">=1.0.0"
geopandas = ">=1.0.0"
ortools = ">=9.10.0"
openpyxl = ">=3.1.0"
rasterio = ">=1.4.0"

[tasks]
dev = "uvicorn app.main:app --reload --port 8000 --app-dir src"
serve = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir src"
lint = "ruff check src"
format = "ruff format src"
db-up = "docker compose -f database/docker-compose.yml up -d postgres"
db-down = "docker compose -f database/docker-compose.yml down"
db-migrate = "alembic -c database/alembic.ini upgrade head"
db-revert = "alembic -c database/alembic.ini downgrade -1"
db-reset = "docker compose -f database/docker-compose.yml down -v && docker compose -f database/docker-compose.yml up -d --wait postgres && alembic -c database/alembic.ini upgrade head"
load-registry = "PYTHONPATH=src python database/scripts/load_registry.py"
load-dataimk2026 = "PYTHONPATH=src python database/scripts/load_dataimk2026.py"
load-jordbundskort = "PYTHONPATH=src python database/scripts/load_jordbundskort.py"
load-kystvandoplande = "PYTHONPATH=src python database/scripts/load_kystvandoplande.py"
load-oekologi-hnv = "PYTHONPATH=src python database/scripts/load_oekologi_hnv.py"
load-retentionskort = "PYTHONPATH=src python database/scripts/load_retentionskort.py"
load-mars-projekter = "PYTHONPATH=src python database/scripts/load_mars_projekter.py"
load-historisk-goedningsfordeling = "PYTHONPATH=src python database/scripts/load_historisk_goedningsfordeling.py"
load-saedskifte-lookup = "PYTHONPATH=src python database/scripts/load_saedskifte_lookup.py"
load-afgroede-normer = "PYTHONPATH=src:. python database/scripts/load_afgroede_normer.py"
load-afstromningskategorier = "PYTHONPATH=src:. python database/scripts/load_afstromningskategorier.py"
load-salgspriser = "PYTHONPATH=src:. python database/scripts/load_salgspriser.py"
load-halmudbytte = "PYTHONPATH=src:. python database/scripts/load_halmudbytte.py"
load-arbejdssatser = "PYTHONPATH=src:. python database/scripts/load_arbejdssatser.py"
load-arbejdsmaengder = "PYTHONPATH=src:. python database/scripts/load_arbejdsmaengder.py"
load-dyrkningsomkostninger = "PYTHONPATH=src:. python database/scripts/load_dyrkningsomkostninger.py"
load-prisliste = "PYTHONPATH=src:. python database/scripts/load_prisliste.py"
load-kvotegivende-areal = "PYTHONPATH=src python database/scripts/load_kvotegivende_areal.py"
load-registry-from-merged-gpkg = "PYTHONPATH=src python database/scripts/load_registry_from_merged_gpkg.py"
load-registry-data = "alembic -c database/alembic.ini upgrade head && PYTHONPATH=src python database/scripts/load_registry_from_merged_gpkg.py && PYTHONPATH=src python database/scripts/load_kystvandoplande.py && PYTHONPATH=src python database/scripts/load_mars_projekter.py && PYTHONPATH=src python database/scripts/load_historisk_goedningsfordeling.py && PYTHONPATH=src python database/scripts/load_saedskifte_lookup.py && PYTHONPATH=src:. python database/scripts/load_afgroede_normer.py && PYTHONPATH=src:. python database/scripts/load_afstromningskategorier.py && PYTHONPATH=src:. python database/scripts/load_salgspriser.py && PYTHONPATH=src:. python database/scripts/load_halmudbytte.py && PYTHONPATH=src:. python database/scripts/load_arbejdssatser.py && PYTHONPATH=src:. python database/scripts/load_arbejdsmaengder.py && PYTHONPATH=src:. python database/scripts/load_dyrkningsomkostninger.py && PYTHONPATH=src:. python database/scripts/load_prisliste.py"
