name: Deploy dev

on:
  push:
    branches:
      - dev

permissions: {}

concurrency:
  group: dispatch-dev-deployment
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch private dev deployments
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PLANTPERFORM_DEPLOY_DISPATCH_TOKEN }}
          script: |
            const inputs = { public_commit: context.sha };
            const workflows = ["backend.yml", "frontend.yml"];

            await Promise.all(
              workflows.map((workflow_id) =>
                github.rest.actions.createWorkflowDispatch({
                  owner: "cordulus",
                  repo: "plantperform",
                  workflow_id,
                  ref: "dev",
                  inputs,
                }),
              ),
            );

            core.notice(
              `Dispatched ${workflows.join(" and ")} for public commit ${context.sha}.`,
            );
